name: Subspace
options:
  bundleIdPrefix: app.subspace
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.0'
packages:
  SubspaceCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
targets:
  Subspace:
    type: application
    platform: iOS
    sources:
      - path: Subspace
        excludes: [Core]
    dependencies:
      - package: SubspaceCore
    # Lets Files and the share sheet hand a JSON backup to the app ("Share → Subvelle").
    # "Alternate" rank: offered as an option, never made the default app for JSON files.
    info:
      path: Subspace/Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Subvelle backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.plain-text]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.subspace.ios
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Subvelle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  SubspaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/SubspaceAppTests]
    dependencies:
      - target: Subspace
      - package: SubspaceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.subspace.tests
        GENERATE_INFOPLIST_FILE: YES
  SubspaceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/SubspaceUITests]
    dependencies:
      - target: Subspace
      - package: SubspaceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.subspace.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Subspace

schemes:
  Subspace:
    build:
      targets:
        Subspace: all
        SubspaceTests: [test]
        SubspaceUITests: [test]
    test:
      targets: [SubspaceTests, SubspaceUITests]
      gatherCoverageData: true
    archive:
      config: Release
