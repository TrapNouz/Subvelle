name: Android · build, test and APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: versionName (MAJOR.MINOR.PATCH)
        required: true
        default: 1.1.0
        type: string
      release_tag:
        description: Optional release tag (for example v1.1.0) to attach the signed APK to; empty = build and test only
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ inputs.release_tag }}
  # Never cancel a running build (owner rule): a newer run waits for the current one.
  cancel-in-progress: false
defaults:
  run:
    working-directory: android
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${{ inputs.version }}"; fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version must be MAJOR.MINOR.PATCH"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=Subvelle-$version-$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_OUTPUT"
      - name: Prepare release signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Diagnostics print only lengths and yes/no checks, never secret contents.
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            cleaned=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
            if ! printf '%s' "$cleaned" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (${#cleaned} characters after removing whitespace). Re-run the copy command in PowerShell right before pasting; a 4096-bit key is about 3,500-6,000 characters."
              exit 1
            fi
            size=$(stat -c %s "$RUNNER_TEMP/release.jks")
            echo "Decoded keystore: $size bytes."
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::The keystore ($size bytes) could not be opened with ANDROID_KEYSTORE_PASSWORD. Check the password secret, or that the base64 secret is the complete key."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::The keystore opened, but it has no key named by ANDROID_KEY_ALIAS (${#KEY_ALIAS} characters). It should be: subspace"
              exit 1
            fi
            echo "Keystore, password and alias verified."
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release APK will be unsigned and cannot be installed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests, lint and optimized (R8) release build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease -PappVersion=${{ steps.version.outputs.version }} -PappBuild=$GITHUB_RUN_NUMBER --console=plain
      - name: Verify and name the APK
        run: |
          mkdir -p out
          if [ "${{ steps.sign.outputs.signed }}" = true ]; then
            src=app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$src" | head -3
          else
            src=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          cp "$src" "out/${{ steps.version.outputs.apk }}"
          (cd out && sha256sum *.apk > "${{ steps.version.outputs.apk }}.sha256")
          ls -la out
      - name: Check the cross-version backup file
        run: test -s app/build/android-backup.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/out/*
            android/app/build/android-backup.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: UI tests on an Android 14 emulator, then frame-timing report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew connectedBenchmarkAndroidTest -PtestBuildType=benchmark --console=plain; status=$?; echo "Frame timing for real swipes over 300 subscriptions (optimized non-debuggable build, software-rendered emulator):"; grep -rh "SubspaceFrames" app/build/outputs/androidTest-results | sed 's/.*SubspaceFrames: //' | sort -u; exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-test-reports
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore

  publish:
    needs: [build, ui-tests]
    if: needs.build.outputs.signed == 'true' && (github.ref_type == 'tag' || inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Attach the signed APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          files=$(ls dist/out/*.apk dist/out/*.sha256)
          # On a tag push the iOS workflow creates the release (~30 min); wait for it rather than racing it.
          for attempt in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" $files --clobber; exit 0; fi
            [ "$GITHUB_REF_TYPE" = tag ] || break
            sleep 30
          done
          gh release create "$TAG" $files --title "Subvelle $TAG" --notes "Subvelle: a private, local-first subscription tracker. Android (8.0+): open the .apk on your phone and allow the install when asked. Backups from either version import into the other."
