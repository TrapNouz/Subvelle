name: Test and build SideStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: subspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prefer Xcode 27 when installed
        run: |
          python3 - <<'PYCODE'
          import glob, os, re
          installed = glob.glob('/Applications/Xcode*.app')
          print('Installed Xcode applications:', installed)
          modern = [path for path in installed if re.search(r'Xcode[_ ]27(?:[._ ]|\.app)', path)]
          if modern:
              selected = max(modern, key=lambda path: (tuple(map(int, re.findall(r'\d+', path))), 'beta' not in path.lower()))
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('DEVELOPER_DIR=' + selected + '/Contents/Developer\n')
          else:
              print('Xcode 27 is not installed; using the runner’s current stable Xcode.')
          PYCODE
      - name: Record SDK and compatibility inventory
        run: |
          xcodebuild -version | tee CIEnvironment.txt
          xcodebuild -showsdks | tee -a CIEnvironment.txt
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK%%.*}" -ge 26
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test financial domain
        run: swift test --parallel
      - name: Discover iOS 26 and iOS 27 simulators
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PYCODE'
          import json, os, re
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/devices.json'))
          matrix = []
          for major in (26, 27):
              options = [(runtime, device) for runtime, devices in data['devices'].items() if re.search(r'iOS-' + str(major) + r'(?:-|$)', runtime) for device in devices if 'iPhone' in device['name'] and device.get('isAvailable')]
              if not options:
                  print(f'iOS {major} runtime unavailable on this runner; not tested.')
                  continue
              runtime = max({item[0] for item in options}, key=lambda value: tuple(map(int, re.findall(r'\d+', value))))
              devices = [device for candidate, device in options if candidate == runtime]
              device = min(devices, key=lambda item: ('Max' in item['name'] or 'Plus' in item['name'], 'Pro' in item['name'], item['name']))
              matrix.append({'major': major, 'runtime': runtime, 'name': device['name'], 'udid': device['udid']})
          if not matrix:
              raise SystemExit('No supported iOS 26/27 iPhone simulator is available.')
          json.dump(matrix, open('SimulatorMatrix.json', 'w'), indent=2)
          print(json.dumps(matrix, indent=2))
          PYCODE
      - name: Compile and run persistence and UI regression tests
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' > "$RUNNER_TEMP/simulators.tsv"
          import json
          for device in json.load(open('SimulatorMatrix.json')):
              print(str(device['major']) + '\t' + device['udid'])
          PYCODE
          while IFS=$'\t' read -r major identifier; do
            xcrun simctl boot "$identifier"
            xcrun simctl bootstatus "$identifier" -b
            xcrun simctl status_bar "$identifier" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            xcodebuild test -project Subspace.xcodeproj -scheme Subspace \
              -destination "platform=iOS Simulator,id=$identifier" \
              -parallel-testing-enabled NO -resultBundlePath "TestResults-iOS$major.xcresult" \
              CODE_SIGNING_ALLOWED=NO
            xcrun simctl shutdown "$identifier"
          done < "$RUNNER_TEMP/simulators.tsv"
      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p Screenshots
          for result in TestResults-iOS*.xcresult; do
            if [ -d "$result" ]; then
              name="${result%.xcresult}"
              xcrun xcresulttool export attachments --path "$result" --output-path "Screenshots/$name"
            fi
          done
      - name: Upload simulator screenshots and SDK inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-and-sdk-inventory
          path: |
            Screenshots
            CIEnvironment.txt
            SimulatorMatrix.json
          if-no-files-found: error
      - name: Determine version
        run: |
          python3 - <<'PY'
          import os, re
          ref = os.environ.get('GITHUB_REF_NAME', '')
          version = ref[1:] if os.environ.get('GITHUB_REF_TYPE') == 'tag' and ref.startswith('v') else '1.0.0'
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Release tag must be vMAJOR.MINOR.PATCH (for example v1.0.0).')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APP_VERSION=' + version + '\n')
              env.write('IPA_NAME=Subspace-' + version + '-' + os.environ['GITHUB_RUN_NUMBER'] + '.ipa\n')
          PY
      - name: Build unsigned iPhone app
        run: |
          xcodebuild build -project Subspace.xcodeproj -scheme Subspace -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Package standard IPA
        run: |
          mkdir -p staging/Payload
          ditto build/Build/Products/Release-iphoneos/Subspace.app staging/Payload/Subspace.app
          test -f staging/Payload/Subspace.app/Subspace
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' staging/Payload/Subspace.app/Info.plist
          cd staging
          /usr/bin/zip -qry "../$IPA_NAME" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Subspace-${{ env.APP_VERSION }}-unsigned-IPA
          path: '*.ipa'
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults-*.xcresult
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Subspace-*-unsigned-IPA
          merge-multiple: true
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.ipa --verify-tag --title "Subspace $TAG" \
            --notes 'Unsigned iPhone IPA for SideStore. SideStore must sign the app before installation. Requires iOS 26 or later. No Apple credentials or signing secrets are used by this build.'
