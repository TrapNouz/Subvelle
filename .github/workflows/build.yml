name: Test and build SideStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: subspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify iOS 26 SDK
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK%%.*}" -ge 26
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test financial domain
        run: swift test --parallel
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/devices.json'))
          candidates = [(runtime, device) for runtime, devices in data['devices'].items() if 'iOS-26' in runtime for device in devices if 'iPhone' in device['name'] and device.get('isAvailable')]
          if not candidates:
              raise SystemExit('An iOS 26 iPhone simulator is required on this runner.')
          device = sorted(candidates, key=lambda item: item[0], reverse=True)[0][1]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + device['udid'] + '\n')
          PY
      - name: Compile app and test SwiftData persistence
        run: |
          set -o pipefail
          xcodebuild test -project Subspace.xcodeproj -scheme Subspace \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Determine version
        run: |
          python3 - <<'PY'
          import os, re
          ref = os.environ.get('GITHUB_REF_NAME', '')
          version = ref[1:] if os.environ.get('GITHUB_REF_TYPE') == 'tag' and ref.startswith('v') else '1.0.0'
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Release tag must be vMAJOR.MINOR.PATCH (for example v1.0.0).')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APP_VERSION=' + version + '\n')
              env.write('IPA_NAME=Subspace-' + version + '-' + os.environ['GITHUB_RUN_NUMBER'] + '.ipa\n')
          PY
      - name: Build unsigned iPhone app
        run: |
          xcodebuild build -project Subspace.xcodeproj -scheme Subspace -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Package standard IPA
        run: |
          mkdir -p staging/Payload
          ditto build/Build/Products/Release-iphoneos/Subspace.app staging/Payload/Subspace.app
          test -f staging/Payload/Subspace.app/Subspace
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' staging/Payload/Subspace.app/Info.plist
          cd staging
          /usr/bin/zip -qry "../$IPA_NAME" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Subspace-${{ env.APP_VERSION }}-unsigned-IPA
          path: '*.ipa'
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Subspace-*-unsigned-IPA
          merge-multiple: true
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.ipa --verify-tag --title "Subspace $TAG" \
            --notes 'Unsigned iPhone IPA for SideStore. SideStore must sign the app before installation. Requires iOS 26 or later. No Apple credentials or signing secrets are used by this build.'
